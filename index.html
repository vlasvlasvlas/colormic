<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="ColorMic: visuales y sonido reactivo al microfono con presets YAML." />
  <title>ColorMic</title>
  <link rel="stylesheet" href="styles.css" />
  <script src="js-yaml.min.js"></script>
  <script src="chroma.js"></script>
  <script src="app.js" defer></script>
</head>
<body class="theme-black">
  <canvas id="stage" aria-label="ColorMic performance canvas"></canvas>

  <header class="surface-bar" aria-label="Controles principales">
    <button id="settingsToggle" class="icon-button" type="button" aria-label="Abrir configuracion" data-tip="Configuracion">
      &#9776;
    </button>
    <button id="startMic" class="primary-button" type="button">MIC</button>
    <button id="backgroundToggle" class="icon-button wide" type="button" aria-label="Cambiar fondo" data-tip="Fondo negro/blanco">
      B/W
    </button>
    <button id="helpToggle" class="icon-button" type="button" aria-label="Ayuda" data-tip="Ayuda">
      _?_
    </button>
  </header>

  <aside id="sidebar" class="sidebar" aria-label="Configuracion">
    <div class="sidebar-head">
      <div>
        <p class="eyebrow">ColorMic</p>
        <h1>Control</h1>
      </div>
      <button id="closeSidebar" class="ghost-button" type="button" aria-label="Cerrar configuracion">&times;</button>
    </div>

    <div class="control-grid">
      <button id="stopMic" class="quiet-button" type="button">Stop</button>
      <button id="applyAll" class="quiet-button" type="button">Apply</button>
    </div>

    <label for="colorPreset">Color preset</label>
    <select id="colorPreset"></select>

    <label for="soundPreset">Sound preset</label>
    <select id="soundPreset"></select>

    <div class="metrics">
      <div>
        <span>RMS</span>
        <strong id="mRms">0.000</strong>
      </div>
      <div>
        <span>Centroid</span>
        <strong id="mCentroid">0 Hz</strong>
      </div>
      <div>
        <span>Flux</span>
        <strong id="mFlux">0.000</strong>
      </div>
    </div>

    <div class="live-controls" aria-label="Controles visuales">
      <div class="range-row">
        <label for="micSensitivity">Mic sensitivity</label>
        <output id="micSensitivityValue" for="micSensitivity">1.40x</output>
      </div>
      <input id="micSensitivity" type="range" min="0.2" max="5" step="0.05" value="1.4" />

      <div class="range-row">
        <label for="visualIntensity">Color intensity</label>
        <output id="visualIntensityValue" for="visualIntensity">1.00</output>
      </div>
      <input id="visualIntensity" type="range" min="0" max="2" step="0.05" value="1" />

      <div class="toggle-stack">
        <label class="toggle-line">
          <input id="toggleBlend" type="checkbox" checked />
          <span>Color blend</span>
        </label>
        <label class="toggle-line">
          <input id="toggleBloom" type="checkbox" checked />
          <span>Bloom</span>
        </label>
        <label class="toggle-line">
          <input id="toggleWaveform" type="checkbox" checked />
          <span>Waveform</span>
        </label>
      </div>
    </div>

    <label for="colorYaml">Color YAML</label>
    <textarea id="colorYaml" spellcheck="false"></textarea>

    <label for="soundYaml">Sound YAML</label>
    <textarea id="soundYaml" spellcheck="false"></textarea>

    <p id="status" class="status">Ready</p>
  </aside>

  <dialog id="helpModal" class="help-modal">
    <form method="dialog">
      <button class="ghost-button close-help" aria-label="Cerrar ayuda">&times;</button>
    </form>
    <p class="eyebrow">About</p>
    <h2>ColorMic</h2>
    <p>
      Instrumento web para usar el microfono como fuente de color, gesto visual y procesamiento sonoro.
      Los presets se editan como YAML para color, reverb, delay, filtros y LFO.
    </p>
    <a href="https://github.com/vlasvlasvlas/colormic" target="_blank" rel="noreferrer">github.com/vlasvlasvlas/colormic</a>
  </dialog>
</body>
</html>
